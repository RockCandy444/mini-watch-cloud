name: m5d1-monitor
services:
  monitor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor_db
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: classroom-monitor-only
    volumes:
      - monitor-data:/var/lib/postgresql/data
      - ./monitor/backend/sql/prepare_monitor.sql:/docker-entrypoint-initdb.d/01-monitor.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U monitor -d monitor_db']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [monitor-data]
  monitor-api:
    build:
      context: .
      dockerfile: monitor/backend/Dockerfile
    environment:
      DB_HOST: monitor-db
      DB_PORT: '5432'
      DB_NAME: monitor_db
      DB_USER: monitor
      DB_PASSWORD: classroom-monitor-only
      SECRET_KEY: classroom-compose-session-key-not-for-production
      FRONTEND_ORIGIN: http://localhost:8082
    depends_on:
      monitor-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [monitor-web, monitor-data, events]
  monitor-web:
    build: ./monitor/next-frontend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    depends_on:
      monitor-api:
        condition: service_healthy
    networks: [monitor-web]
  monitor-gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8082:80']
    volumes:
      - ./gateway/monitor.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      monitor-api:
        condition: service_healthy
      monitor-web:
        condition: service_started
    networks: [monitor-web]
networks:
  monitor-web:
  monitor-data:
    internal: true
  events:
    external: true
    name: m5d1-events
volumes:
  monitor-data:

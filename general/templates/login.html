{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='login.js') }}" defer></script>{% endblock %}
{% block content %}
<div class="page-top"><a class="back-link" href="{{ url_for('posts.index') }}">← 목록으로</a></div>
<section class="content-card login-card"><p class="eyebrow">WELCOME BACK</p><h1>다시 만나 반가워요<span class="accent-dot">.</span></h1><p class="page-description">수업에서 등록한 아이디로 로그인 결과를 확인해요.</p><form id="login-form" action="{{ url_for('auth.login') }}" method="post" class="post-form"><div class="form-field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required></div><div class="form-field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button button-primary" type="submit">로그인 확인</button></form><p id="login-result" role="status" aria-live="polite" hidden></p></section>
<p class="page-description">계정이 없다면 <a href="{{ config.FRONTEND_ORIGIN.rstrip('/') }}/register/general">회원가입</a>으로 바로 만들 수 있어요.</p>
{% endblock %}

name: m5d2-general
services:
  general-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: general
      POSTGRES_PASSWORD: classroom-general-only
    volumes:
      - general-data:/var/lib/postgresql/data
      - ./general/sql/prepare_users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./general/sql/prepare_posts.sql:/docker-entrypoint-initdb.d/02-posts.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U general -d general_db']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [general-data]
  general-api:
    build:
      context: ./general
      dockerfile: Dockerfile
    environment:
      DB_HOST: general-db
      DB_PORT: '5432'
      DB_NAME: general_db
      DB_USER: general
      DB_PASSWORD: classroom-general-only
      DB_SSLMODE: disable
      SECRET_KEY: classroom-day2-general-session-key-only
      SESSION_COOKIE_SECURE: 'false'
      EVENT_TOKEN: classroom-day2-event-token-only-not-for-production
      MONITOR_URL: http://monitor-api:5000/api/events
      FRONTEND_ORIGIN: http://localhost:8082
    depends_on:
      general-db:
        condition: service_healthy
    networks: [general-web, general-data, events]
  general-gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8081:80']
    volumes:
      - ./gateway/general.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [general-api]
    networks: [general-web]
networks:
  general-web:
  general-data:
    internal: true
  events:
    external: true
    name: m5d1-events
volumes:
  general-data:
